<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#202936">
    <meta name="color-scheme" content="light">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src 'self'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'">

  <body data-page="stats">
    <main id="app" class="app-shell">
      <section class="tracker-head" aria-labelledby="product-title">
        <div class="tracker-identity">
          <span class="identity-mark" aria-hidden="true">53</span>

      <section class="stats-stage" aria-labelledby="stats-title">

        <div id="stats-root" aria-busy="true"><p class="loading-line">Sıralama hazırlanıyor…</p></div>

    <nav id="action-menu" class="action-menu" aria-label="Sayfa işlemleri" hidden><a href="../">Maçlar</a><a href="../edit/">Düzenle</a></nav>

    <div id="notice-region" class="notice-region" aria-live="assertive"></div>
