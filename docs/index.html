<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#202936">
    <meta name="color-scheme" content="light">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="53">
    <meta name="description" content="Haftalık Age of Empires II 4v4 maç defteri.">
    <meta property="og:title" content="Bu Ecof Empires🏹🪓⚔️">
    <meta property="og:description" content="Cortinyanlar ve Bakracoğulları haftalık maç defteri.">
    <meta property="og:image" content="/assets/hero-53.png">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="tr_TR">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src 'self'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'">
    <title>Bu Ecof Empires🏹🪓⚔️</title>
    <link rel="icon" href="./assets/icon-192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="./assets/icon-192.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body data-page="public">
    <!--
      THESIS: One continuous weekly war ledger; it refuses the repeated dashboard-card summary.
      OWN-WORLD: Ink-navy table furniture, sun-warmed parchment cells, bronze rules, solid team banners, and real local civilization crests.
      STORY: See the rivalry score, read every weekly lineup once, then slide right into older battles.
      FIRST VIEWPORT: Compact 53 identity and the score sit directly above the newest match column; editing waits in one lower-right seal.
      FORM: User-pinned weekly matrix, first-ranked horizontal ledger staging, no roll; Excel chronology translated into a touch-first AoE2 record book.
    -->
    <main id="app" class="app-shell">
      <section class="tracker-head" aria-labelledby="product-title">
        <div class="tracker-identity">
          <span class="identity-mark" aria-hidden="true">53</span>
          <div><p>Haftalık 4v4</p><h1 id="product-title">Bu Ecof Empires🏹🪓⚔️</h1></div>
        </div>
        <div id="score-strip" class="score-strip" aria-label="Meydan skoru" aria-busy="true"></div>
      </section>
      <section class="matrix-stage" aria-labelledby="matrix-title">
        <div class="matrix-title-row"><h2 id="matrix-title">Maç Defteri</h2><p>Eski haftalar sağda</p></div>
        <div id="matrix-root" aria-busy="true"><p class="loading-line">Meydan kaydı açılıyor…</p></div>
      </section>
    </main>

    <nav id="action-menu" class="action-menu" aria-label="Sayfa işlemleri" hidden>
      <a href="./edit/">Düzenle</a>
      <a href="./stats/">Sıralama</a>
    </nav>
    <button class="action-seal" type="button" aria-controls="action-menu" aria-expanded="false" aria-label="İşlem menüsünü aç"><span aria-hidden="true">53</span></button>
    <div id="notice-region" class="notice-region" aria-live="assertive" aria-atomic="true"></div>
    <noscript>Maç defterini görmek için JavaScript’i etkinleştir.</noscript>
  </body>
</html>
