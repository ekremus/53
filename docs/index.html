<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
    <meta name="theme-color" content="#3c3022">
    <meta name="color-scheme" content="light">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src 'self'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'; frame-ancestors 'none'">
    <meta name="description" content="Age of Empires II haftalık 3v3 ve 4v4 maç takibi.">
    <title>Bu Ecof Empires🏹🪓⚔️</title>
    <link rel="icon" href="./assets/icon-192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="./assets/icon-192.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <!--
      THESIS: One dense weekly record with one compact signature; it refuses instructions, dashboard summaries, and navigation chrome that repeat what the data already says.
      OWN-WORLD: A restrained heraldic wordmark, Merriweather ink on real parchment, square bronze rules, fixed tournament blue and red, vertical team rails, and local civilization crests.
      STORY: Read 2–0, inspect the complete newest lineup, slide right through older weeks, or switch once to standings; the pencil edits only the surface in view.
      FIRST VIEWPORT: A 40px signature and 44px Maçlar/Sıralama control sit above the 52px score and one complete 504px match matrix at 390×844.
      FORM: User-pinned single-page ledger, first-ranked horizontal matrix staging, no seed roll; match history and editing share one compact geometry.
    -->
    <main id="app" class="app-shell">
      <header class="brand-header" aria-label="Bu Ecof Empires🏹🪓⚔️">
        <img class="brand-wordmark" src="./assets/wordmark-ecof.png" alt="Bu Ecof Empires🏹🪓⚔️">
      </header>
      <nav id="top-control" class="top-control" aria-label="Görünüm ve düzenleme"></nav>
      <section id="score-strip" class="score-strip" aria-label="Skor" aria-busy="true"></section>
      <section id="surface-root" class="surface-root" aria-live="polite" aria-busy="true"><p class="loading-line">Yükleniyor…</p></section>
    </main>

    <dialog id="player-dialog" aria-labelledby="player-dialog-title">
      <form id="dialog-player-form" class="dialog-surface" method="dialog" novalidate>
        <div class="dialog-heading"><strong id="player-dialog-title">Yeni oyuncu</strong><button class="icon-button" type="button" data-close-player-dialog aria-label="Kapat"><img src="./assets/icons/x.svg" alt="" width="20" height="20"></button></div>
        <label for="dialog-player-name">İsim</label>
        <div class="inline-form"><input id="dialog-player-name" name="name" type="text" maxlength="40" autocomplete="off" required><button type="submit">Ekle</button></div>
      </form>
    </dialog>

    <dialog id="edit-auth-dialog" class="dialog--compact" aria-labelledby="edit-auth-title">
      <form id="edit-auth-form" class="dialog-surface" novalidate>
        <div class="dialog-heading"><strong id="edit-auth-title">Düzenle</strong><button class="icon-button" type="button" data-close-edit-auth aria-label="Kapat"><img src="./assets/icons/x.svg" alt="" width="20" height="20"></button></div>
        <label for="edit-auth-password">Şifre</label>
        <div class="inline-form"><input id="edit-auth-password" name="password" type="password" inputmode="numeric" autocomplete="current-password" maxlength="40" required><button type="submit">Aç</button></div>
      </form>
    </dialog>

    <dialog id="player-details-dialog" class="player-details-dialog" aria-labelledby="player-details-title">
      <div id="player-details-content"></div>
    </dialog>

    <div id="notice-region" class="notice-region" aria-live="assertive" aria-atomic="true"></div>
    <noscript>JavaScript gerekli.</noscript>
  </body>
</html>
